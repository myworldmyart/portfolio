<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Manish Wadhwani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Permanent+Marker&family=Indie+Flower&family=Patrick+Hand&family=Special+Elite&family=Rock+Salt&family=Homemade+Apple&family=Reenie+Beanie&family=Amatic+SC:wght@400;700&family=Bowlby+One+SC&family=Shrikhand&display=swap"
    rel="stylesheet">
  
  <style>
    :root {
      --paper: #fdfaf2;
      --line: #b8d4e3;
      --margin: #e85a5a;
      --ink: #1a2438;
      --ink-soft: #2c3e60;
      --blue-pen: #1e4d8b;
      --red-pen: #c0392b;
      --highlight: #fff176;
      --highlight-pink: #f8bbd0;
      --tape: rgba(255, 235, 130, 0.55);
      --tape-edge: rgba(220, 200, 100, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      background-color: #ffffff;
      background-image:
        repeating-linear-gradient(to right, transparent 0, transparent 23px, rgba(80, 110, 160, 0.18) 23px, rgba(80, 110, 160, 0.18) 24px),
        repeating-linear-gradient(to bottom, transparent 0, transparent 23px, rgba(80, 110, 160, 0.18) 23px, rgba(80, 110, 160, 0.18) 24px);
      min-height: 100vh;
      font-family: 'Kalam', cursive;
      color: var(--ink);
      position: relative;
    }

    body::before {
      content: none;
    }

    body::after {
      content: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 60px 60px;
      position: relative;
      z-index: 3;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Caveat', cursive;
      font-size: 26px;
      color: var(--blue-pen);
      text-decoration: none;
      margin-bottom: 30px;
      padding: 6px 14px;
      background: #fff;
      box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.10);
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
    }

    .back-btn:hover {
      transform: rotate(0deg) translateX(-4px);
      color: var(--red-pen);
    }

    .back-btn .arrow {
      font-family: 'Permanent Marker', cursive;
      font-size: 22px;
    }

    /* HERO */
    .project-hero {
      margin-bottom: 50px;
      position: relative;
    }

    .project-meta {
      display: flex;
      gap: 20px;
      align-items: baseline;
      margin-bottom: 8px;
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      color: var(--red-pen);
      transform: rotate(-1deg);
    }

    .project-meta .dot {
      color: var(--ink);
      opacity: 0.4;
    }

    .project-title {
      font-family: 'Shrikhand', cursive;
      font-size: 86px;
      line-height: 0.95;
      color: var(--ink);
      transform: rotate(-2deg);
      margin-bottom: 10px;
      display: inline-block;
      max-width: 100%;
      word-break: break-word;
    }

    .project-title .accent {
      color: var(--red-pen);
    }

    .project-subtitle {
      font-family: 'Caveat', cursive;
      font-size: 32px;
      color: var(--blue-pen);
      transform: rotate(-1deg);
      max-width: 700px;
      line-height: 1.2;
      margin-top: 4px;
    }

    /* Hero visual */
    .hero-visual {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      background: linear-gradient(135deg, #1a2438, #4a5d80);
      position: relative;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .hero-visual img,
    .hero-visual video {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero-visual.placeholder-mode {
      aspect-ratio: 16 / 9;
    }

    .hero-visual::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 8%;
      transform: rotate(-3deg);
      width: 120px;
      height: 24px;
      background: var(--tape);
      border: 1px dashed var(--tape-edge);
    }

    .hero-visual::after {
      content: '';
      position: absolute;
      top: -10px;
      right: 8%;
      transform: rotate(4deg);
      width: 120px;
      height: 24px;
      background: var(--tape);
      border: 1px dashed var(--tape-edge);
    }

    .hero-visual .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Shrikhand', sans-serif;
      font-size: 200px;
      color: rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .hero-visual .placeholder-note {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-family: 'Indie Flower', cursive;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
    }

    /* CONTENT SECTIONS */
    .content-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 50px;
      margin-bottom: 60px;
    }

    .meta-side {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .meta-block h4 {
      font-family: 'Reenie Beanie', cursive;
      font-size: 28px;
      color: var(--red-pen);
      margin-bottom: 4px;
      transform: rotate(-2deg);
    }

    .meta-block .value {
      font-family: 'Patrick Hand', cursive;
      font-size: 20px;
      color: var(--ink);
      line-height: 1.4;
    }

    .meta-block ul {
      list-style: none;
      font-family: 'Patrick Hand', cursive;
      font-size: 19px;
      color: var(--ink);
      line-height: 1.5;
    }

    .meta-block ul li::before {
      content: '✓ ';
      color: var(--blue-pen);
      margin-right: 4px;
    }

    .body-content {}

    .body-content h3 {
      font-family: 'Permanent Marker', cursive;
      font-size: 36px;
      color: var(--ink);
      margin: 30px 0 16px;
      transform: rotate(-1deg);
      display: inline-block;
    }

    .body-content h3:first-child {
      margin-top: 0;
    }

    .body-content h3 .accent {
      color: var(--red-pen);
    }

    .body-content p {
      font-family: 'Kalam', cursive;
      font-size: 20px;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 18px;
      max-width: 700px;
    }

    .body-content p .hl {
      background: linear-gradient(180deg, transparent 50%, var(--highlight) 50%, var(--highlight) 90%, transparent 90%);
      padding: 0 4px;
    }

    .body-content p .hl-pink {
      background: linear-gradient(180deg, transparent 50%, var(--highlight-pink) 50%, var(--highlight-pink) 90%, transparent 90%);
      padding: 0 4px;
    }

    .body-content blockquote {
      font-family: 'Homemade Apple', cursive;
      font-size: 22px;
      color: var(--blue-pen);
      border-left: 4px solid var(--red-pen);
      padding-left: 20px;
      margin: 30px 0;
      transform: rotate(-0.5deg);
      max-width: 600px;
      line-height: 1.5;
    }

    /* GALLERY */
    .gallery-section {
      margin: 60px 0;
    }

    .gallery-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 42px;
      color: var(--ink);
      margin-bottom: 30px;
      transform: rotate(-1deg);
      display: inline-block;
    }

    .gallery-title .accent {
      color: var(--red-pen);
    }

    .gallery-grid {
      column-count: 3;
      column-gap: 30px;
    }

    @media (max-width: 920px) {
      .gallery-grid {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        column-count: 1;
      }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 30px;
      display: inline-block;
      width: 100%;
      background: #fefefe;
      padding: 12px 12px 36px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 80px;
      height: 18px;
      background: var(--tape);
      border: 1px dashed var(--tape-edge);
    }

    .gallery-item.r1 {
      transform: rotate(-2deg);
    }

    .gallery-item.r2 {
      transform: rotate(1deg);
    }

    .gallery-item.r3 {
      transform: rotate(-1deg);
    }

    .gallery-item.r4 {
      transform: rotate(2deg);
    }

    .gallery-item .img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Indie Flower', cursive;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
    }

    .gallery-item .img-placeholder.g1 {
      background: linear-gradient(135deg, #2c3e60, #c0392b);
    }

    .gallery-item .img-placeholder.g2 {
      background: linear-gradient(135deg, #6a3aa0, #f4a02c);
    }

    .gallery-item .img-placeholder.g3 {
      background: linear-gradient(135deg, #1aae5f, #2d6cdf);
    }

    .gallery-item .img-placeholder.g4 {
      background: linear-gradient(135deg, #c0392b, #e94e3d);
    }

    .gallery-item .img-real {
      width: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
      display: block;
    }

    .gallery-item .img-real img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-item .img-real video {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-item .caption {
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: var(--ink);
      text-align: center;
      margin-top: 8px;
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
    }

    /* CREDITS */
    .credits-section {
      margin: 50px 0;
      padding: 30px;
      background: rgba(253, 246, 196, 0.4);
      border: 2px dashed var(--blue-pen);
      transform: rotate(-0.3deg);
      position: relative;
    }

    .credits-section h3 {
      font-family: 'Permanent Marker', cursive;
      font-size: 32px;
      color: var(--red-pen);
      margin-bottom: 16px;
      text-align: center;
    }

    .credits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      font-family: 'Patrick Hand', cursive;
      font-size: 19px;
      color: var(--ink);
      text-align: center;
    }

    .credits-grid .credit-role {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      color: var(--blue-pen);
      display: block;
      margin-bottom: 2px;
    }

    /* NAV between projects */
    .project-nav {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 2px dashed var(--ink-soft);
      flex-wrap: wrap;
    }

    .nav-link {
      flex: 1;
      min-width: 200px;
      padding: 16px 20px;
      background: #fff;
      box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.10);
      text-decoration: none;
      color: var(--ink);
      font-family: 'Caveat', cursive;
      transition: transform 0.3s ease;
      transform: rotate(-1deg);
    }

    .nav-link:hover {
      transform: rotate(0deg) translateY(-3px);
    }

    .nav-link.next {
      transform: rotate(1deg);
      text-align: right;
    }

    .nav-link .arrow {
      font-size: 24px;
      color: var(--red-pen);
      display: block;
      font-family: 'Permanent Marker';
    }

    .nav-link .title-small {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.1;
      margin-top: 4px;
      display: block;
      color: var(--ink);
    }

    /* Not found state */
    .not-found {
      text-align: center;
      padding: 80px 20px;
      font-family: 'Caveat', cursive;
      font-size: 36px;
      color: var(--red-pen);
    }

    .not-found a {
      display: inline-block;
      margin-top: 20px;
      font-family: 'Permanent Marker';
      color: var(--blue-pen);
      text-decoration: none;
      font-size: 26px;
    }

    @media (max-width: 920px) {
      .container {
        padding: 30px 30px 40px;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .project-title {
        font-size: 56px;
      }

      .hero-visual .placeholder {
        font-size: 100px;
      }
    }
  </style>
</head>
